# Determinism guardrails. Only crates that deny `clippy::disallowed_types`
# (chassis, oxide-sim, oxide-opponent, oxide-net) actually enforce
# this list; shell and driver may use hash maps freely.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is nondeterministic — use BTreeMap or a Vec with stable ids" },
    { path = "std::collections::HashSet", reason = "iteration order is nondeterministic — use BTreeSet or a sorted Vec" },
]

# Functions past this length are split or carry a reasoned `#[expect]`.
too-many-lines-threshold = 250

# Modules split into child files share their parent's imports through
# `use super::*`; every other glob import still warns.
allowed-wildcard-imports = ["super"]
