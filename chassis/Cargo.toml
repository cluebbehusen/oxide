[package]
name = "chassis"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Reusable deterministic-simulation toolkit: fixed-point math, RNG, state hashing, grids, pathfinding, replays"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
fixed = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Reference implementation used only to cross-check our hand-rolled PCG32.
rand_pcg = "0.9"
rand_core = "0.9"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
float_arithmetic = "deny"
disallowed_types = "deny"
