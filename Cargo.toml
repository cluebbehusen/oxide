[workspace]
resolver = "3"
members = ["chassis", "sim", "protocol", "shell", "driver"]

[workspace.package]
version = "0.3.1"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
fixed = { version = "1", features = ["serde"] }
anyhow = "1"
thiserror = "2"

chassis = { path = "chassis" }
oxide-sim = { path = "sim" }
oxide-protocol = { path = "protocol" }
