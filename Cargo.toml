[workspace]
resolver = "3"
members = ["chassis", "sim", "protocol", "kit", "shell", "driver"]

[workspace.package]
version = "0.15.1"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
postcard = { version = "1", features = ["alloc"] }
fixed = { version = "1", features = ["serde"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"

chassis = { path = "chassis" }
oxide-sim = { path = "sim" }
oxide-protocol = { path = "protocol" }
oxide-kit = { path = "kit" }

# `cargo run` is how the game is played day to day, and an unoptimized
# `fixed`-point sim ticks ~25x slower than release — big battles would eat
# the frame budget. Light optimization for our code, full for dependencies,
# keeps debug builds honest without hurting incremental compiles.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Release keeps line tables permanently: sampling profilers stay usable
# without env-toggled rebuilds, and a toggle invalidates the entire
# release fingerprint set — the artifact churn that inflates target/.
[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
