[workspace]
resolver = "3"
members = ["chassis", "sim", "bot", "protocol", "kit", "shell", "driver"]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
postcard = { version = "1", features = ["alloc"] }
fixed = { version = "1", features = ["serde"] }
anyhow = "1"
thiserror = "2"

chassis = { path = "chassis" }
oxide-sim = { path = "sim" }
oxide-bot = { path = "bot" }
oxide-protocol = { path = "protocol" }
oxide-kit = { path = "kit" }

# iPadOS 27 refuses to launch apps linked against its SDK unless they adopt
# the UIScene lifecycle, and only unreleased miniquad master does. The pin
# also brings iOS dpi reporting. Drop it once a release carries both.
[patch.crates-io]
miniquad = { git = "https://github.com/not-fl3/miniquad", rev = "39c928fb7e09fd44e45f37fe9a98503968bca412" }

# `cargo run` is how the game is played day to day, and an unoptimized
# `fixed`-point sim ticks ~25x slower than release — big battles would eat
# the frame budget. Light optimization for our code, full for dependencies,
# keeps debug builds honest without hurting incremental compiles.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Release keeps line tables permanently: sampling profilers stay usable
# without env-toggled rebuilds, and a toggle invalidates the entire
# release fingerprint set — the artifact churn that inflates target/.
[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Workspace simulation and bot code dominates headless matches. Keep it fully
# optimized while retaining faster incremental builds for the thin host crates.
# Integer-only outcome calculations must not depend on optimization level.
[profile.dev.package.oxide-sim]
opt-level = 3

[profile.dev.package.chassis]
opt-level = 3

[profile.dev.package.oxide-bot]
opt-level = 3
