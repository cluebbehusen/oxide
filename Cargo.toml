[workspace]
resolver = "3"
members = ["chassis", "sim", "protocol", "shell", "driver"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
fixed = { version = "1", features = ["serde"] }
anyhow = "1"
thiserror = "2"

chassis = { path = "chassis" }
oxide-sim = { path = "sim" }
oxide-protocol = { path = "protocol" }

# `cargo run` is how the game is played day to day, and an unoptimized
# `fixed`-point sim ticks ~25x slower than release — big battles would eat
# the frame budget. Light optimization for our code, full for dependencies,
# keeps debug builds honest without hurting incremental compiles.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
