[package]
name = "oxide-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "macroquad renderer and debug server for Oxide"

# The binary is what the OS names the process — the dock and menu bar
# say "Oxide", not the crate's dev-facing package name.
[[bin]]
name = "Oxide"
path = "src/main.rs"

[dependencies]
chassis = { workspace = true }
oxide-sim = { workspace = true }
oxide-protocol = { workspace = true }
oxide-driver = { path = "../driver" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
# The audio feature is NOT in macroquad's defaults — without it every
# sound call is a warning-printing stub.
macroquad = { version = "0.4", features = ["audio"] }
# Screenshots are encoded by hand: macroquad's Image::export_png unwraps
# on write errors, which would let one bad debug-socket path kill the
# whole session.
png = "0.17"

[lints.clippy]
# The workspace-wide disallowed-types list guards *sim* determinism. Shell
# state (interpolation caches, input sets) is presentation and may hash.
disallowed_types = "allow"

[target.'cfg(target_os = "macos")'.dependencies]
# One AppKit call: the full-resolution dock image for bare dev runs
# (miniquad's icon path caps at 64px, which the dock upscales fuzzy).
objc = "0.2"

[lints.rust]
# Deny, not forbid: the dock module carries the one scoped allow for
# its AppKit call. Everything else stays safe Rust.
unsafe_code = "deny"
