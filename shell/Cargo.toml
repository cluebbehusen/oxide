[package]
name = "oxide-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "macroquad renderer and debug server for Oxide"

# The binary is what the OS names the process — the dock and menu bar
# say "Oxide", not the crate's dev-facing package name.
[[bin]]
name = "Oxide"
path = "src/main.rs"

[dependencies]
chassis = { workspace = true }
oxide-sim = { workspace = true }
oxide-protocol = { workspace = true }
oxide-kit = { workspace = true }
oxide-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ciborium = "0.2.2"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
# The audio feature is NOT in macroquad's defaults — without it every
# sound call is a warning-printing stub.
macroquad = { version = "0.4.16", features = ["audio"] }
# Screenshots are encoded by hand: macroquad's Image::export_png unwraps
# on write errors, which would let one bad debug-socket path kill the
# whole session.
png = "0.17"

[lints]
workspace = true
