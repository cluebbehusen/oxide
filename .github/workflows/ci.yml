# Oxide CI: lint, test, and prove cross-platform determinism.
#
# The workspace test matrix includes the state-hash fixtures, so every OS must
# reproduce hashes blessed on one machine bit-for-bit or the "same seed, same
# bits, every platform" invariant is broken.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Stacked pushes to one ref supersede each other; don't run them all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This action selects the toolchain from its @ref, except when the
      # `toolchain` input is set — then the README prescribes the master
      # revision. Pinned to a master-history commit (no version tags
      # exist): master HEAD as of 2026-07-16.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # macroquad links against the platform's windowing/audio stacks even
      # in headless test builds.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Public documentation is a promise too: broken intra-doc links
      # and malformed HTML rot silently without a gate.
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-llvm-cov
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev jq
      - name: Unit coverage
        shell: bash
        run: .github/coverage.sh cov-unit "Unit coverage"
      - name: Combined coverage
        shell: bash
        run: .github/coverage.sh cov-combined "Combined coverage"

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx --yes prettier@3.9.6 --check "**/*.md"

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Validate agent skills
        shell: bash
        run: |
          for skill_file in .agents/skills/*/SKILL.md; do
            skill_dir="${skill_file%/SKILL.md}"
            uvx --from skills-ref==0.1.1 agentskills validate "$skill_dir"
          done

  # The declared rust-version is a promise; moving-stable alone never
  # tests whether the complete test surface still compiles and links on it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Compile tests on MSRV
        run: cargo test --workspace --locked --no-run

  # Generated sprites and sounds are checked for reproducibility, and
  # their generators carry their own pinned inline Python dependencies.
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sprite generator check
        run: uv run tools/gen_sprites.py --check
      - name: Sprite generator tests
        run: uv run --python 3.14 --with 'pillow==12.3.0' -m unittest tools.test_gen_sprites tools.test_production_sprite_sources tools.test_gen_icon
      - name: Sound generator check
        run: uv run tools/gen_sounds.py --check
      - name: Sound tests
        run: uv run --with 'numpy==2.5.1' --with 'scipy==1.18.0' -m unittest tools.test_gen_sounds
      - name: Review tool tests
        run: uv run --python 3.14 -m unittest tools.test_map_review tools.test_asset_review

  # Supply-chain gate: advisories, bans, licenses, and source policy
  # live in deny.toml, including the triage list for macroquad's stale
  # corners.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
